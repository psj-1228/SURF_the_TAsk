spring:
  application:
    name: surf-the-task
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
