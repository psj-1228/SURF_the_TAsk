<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURF the TAsk | 로그인</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/modern.css">
    <script defer src="/js/auth.js"></script>
</head>
<body>
<main class="auth-shell" data-prototype-screen="auth">
    <section class="surf-visual auth-brand-panel" aria-label="SURF the TAsk 해변 배경">
        <div class="auth-hero-copy">
            <strong>SURF<br><span>the TAsk</span></strong>
            <p>스마트한 계획, 더 나은 하루<br>SURF the TAsk와 함께하세요.</p>
        </div>
    </section>

    <section class="auth-panel" aria-label="로그인">
        <div class="auth-copy">
            <h2>로그인</h2>
            <p>계정에 로그인하여 계속하세요.</p>
        </div>

        <form class="auth-form" data-auth-form="login" novalidate>
            <div class="field">
                <label for="loginId">아이디</label>
                <input id="loginId" name="loginId" type="text" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
                    <span aria-hidden="true">◎</span>
                </div>
            </div>

            <div class="login-options">
                <a class="password-find-link" href="/login" data-password-find>비밀번호 찾기</a>
            </div>

            <p class="form-message" data-form-message role="status" aria-live="polite"></p>
            <div class="auth-toast" data-auth-toast role="status" aria-live="polite" hidden></div>

            <button class="primary-button" type="submit">로그인</button>
        </form>

        <p class="switch-copy">
            아직 계정이 없나요?
            <a href="/register">회원가입</a>
        </p>
    </section>
</main>
</body>
</html>
