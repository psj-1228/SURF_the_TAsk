<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURF the TAsk | 회원가입</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/modern.css">
    <script defer src="/js/auth.js"></script>
</head>
<body>
<main class="auth-shell" data-prototype-screen="auth">
    <section class="surf-visual auth-brand-panel" aria-label="SURF the TAsk 해변 배경">
        <div class="auth-hero-copy">
            <strong>SURF<br><span>the TAsk</span></strong>
            <p>스마트한 계획, 더 나은 하루<br>SURF the TAsk와 함께하세요.</p>
        </div>
    </section>

    <section class="auth-panel" aria-label="회원가입">
        <div class="auth-copy">
            <h2>회원가입</h2>
            <p>계정을 만들고 오늘의 계획을 시작하세요.</p>
        </div>

        <form class="auth-form" data-auth-form="register" novalidate>
            <div class="field">
                <label for="loginId">아이디</label>
                <input id="loginId" name="loginId" type="text" autocomplete="username" maxlength="50" required>
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="4" maxlength="100" required>
            </div>

            <div class="field">
                <label for="name">이름</label>
                <input id="name" name="name" type="text" autocomplete="name" maxlength="50" required>
            </div>

            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="100" required>
            </div>

            <p class="form-message" data-form-message role="status" aria-live="polite"></p>

            <button class="primary-button" type="submit">회원가입</button>
        </form>

        <p class="switch-copy">
            이미 계정이 있나요?
            <a href="/login">로그인</a>
        </p>
    </section>
</main>
</body>
</html>
