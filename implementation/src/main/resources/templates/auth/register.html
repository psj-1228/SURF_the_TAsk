<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURF the TAsk | 회원가입</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script defer src="/js/auth.js"></script>
</head>
<body>
<main class="auth-shell">
    <section class="surf-visual" aria-label="SURF the TAsk 해변 배경"></section>

    <section class="auth-panel" aria-label="회원가입">
        <a class="compact-brand" href="/login" aria-label="SURF the TAsk 로그인">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span>
                <strong>SURF the TAsk</strong>
                <small>Availability-aware planner</small>
            </span>
        </a>

        <div class="auth-copy">
            <p class="eyebrow">Create account</p>
            <h2>나만의 Task 파도를 만들 계정을 생성하세요.</h2>
            <p>가입 후 개인 시간표와 Daily Goal, Deadline Task를 연결해 대시보드를 구성할 수 있습니다.</p>
        </div>

        <form class="auth-form" data-auth-form="register" novalidate>
            <div class="field">
                <label for="loginId">아이디</label>
                <input id="loginId" name="loginId" type="text" autocomplete="username" maxlength="50" required>
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="4" maxlength="100" required>
            </div>

            <div class="field">
                <label for="name">이름</label>
                <input id="name" name="name" type="text" autocomplete="name" maxlength="50" required>
            </div>

            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="100" required>
            </div>

            <p class="form-message" data-form-message role="status" aria-live="polite"></p>

            <button class="primary-button" type="submit">회원가입</button>
        </form>

        <p class="switch-copy">
            이미 계정이 있나요?
            <a href="/login">로그인</a>
        </p>
    </section>
</main>
</body>
</html>
