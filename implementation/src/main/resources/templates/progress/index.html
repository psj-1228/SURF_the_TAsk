<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURF the TAsk | Progress</title>
    <link rel="stylesheet" href="/css/progress.css">
    <script defer src="/js/progress.js"></script>
</head>
<body>
<div class="progress-shell" data-progress-page>
    <aside class="side-nav" aria-label="주요 메뉴">
        <a class="side-brand" href="/dashboard" aria-label="SURF the TAsk 대시보드">
            <span>SURF</span>
            <strong>the TAsk</strong>
        </a>
        <nav class="nav-list">
            <a href="/dashboard">대시보드</a>
            <a class="active" href="/progress">Progress</a>
        </nav>
    </aside>

    <main class="progress-main">
        <header class="progress-topbar">
            <div>
                <p class="eyebrow">Progress</p>
                <h1>Daily Goal streak</h1>
                <p data-progress-date>진행도 데이터를 불러오는 중입니다.</p>
            </div>
            <a class="ghost-link" href="/dashboard">대시보드</a>
        </header>

        <section class="summary-grid" data-progress-summary aria-label="진행도 요약">
            <article class="summary-item">
                <span>전체 완료율</span>
                <strong data-completion-rate>0%</strong>
                <small>전체 Task 기준</small>
            </article>
            <article class="summary-item">
                <span>완료 Task</span>
                <strong data-done-tasks>0</strong>
                <small data-total-tasks>전체 0개</small>
            </article>
            <article class="summary-item">
                <span>미완료 Task</span>
                <strong data-incomplete-tasks>0</strong>
                <small>남은 항해</small>
            </article>
            <article class="summary-item">
                <span>최고 Streak</span>
                <strong data-best-streak>0일</strong>
                <small>Daily Goal 기준</small>
            </article>
        </section>

        <section class="progress-grid">
            <article class="wave-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">Monthly wave</p>
                        <h2>이번 달 진행도</h2>
                    </div>
                    <strong data-wave-rate>0%</strong>
                </div>
                <div class="wave-visual" data-wave-visual style="--wave-level: 12%;">
                    <span class="wave-fill"></span>
                    <span class="wave-crest crest-one"></span>
                    <span class="wave-crest crest-two"></span>
                    <span class="wave-crest crest-three"></span>
                </div>
                <p class="panel-note" data-wave-note>완료율이 올라갈수록 파도가 높아집니다.</p>
            </article>

            <article class="panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">Priority</p>
                        <h2>우선순위 Task</h2>
                    </div>
                </div>
                <div class="task-list" data-priority-list></div>
            </article>
        </section>

        <section class="panel streak-panel" aria-label="Daily Goal streak">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Daily Goal</p>
                    <h2>Goal별 streak</h2>
                </div>
                <span class="count-badge" data-daily-goal-count>0</span>
            </div>
            <div class="streak-list" data-daily-streak-list></div>
        </section>

        <p class="load-message" data-progress-message role="status" aria-live="polite"></p>
    </main>
</div>
</body>
</html>
